<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fournyl — où ouvrir ou reprendre une boulangerie</title>
  <meta name="description" content="Chaque commune de France notée à partir des données publiques, pour choisir où ouvrir ou reprendre une boulangerie.">
  <meta name="theme-color" content="#B42318">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta property="og:title" content="Fournyl — où ouvrir ou reprendre une boulangerie">
  <meta property="og:description" content="Chaque commune de France notée à partir des données publiques.">
  <meta property="og:image" content="img/icon-512.png">
  <link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="data/communes-index.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="vendor/maplibre-gl-6.11.2/maplibre-gl.css">
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/main.js"></script>
  <!-- analytics -->
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-labelledby="app-title">
      <button type="button" class="sheet-toggle" id="sheet-toggle" aria-expanded="false" aria-controls="sidebar-body">
        <span id="sheet-title" data-i18n="top.title"></span>
      </button>
      <div class="sidebar-body" id="sidebar-body">
        <div class="brand">
          <a class="brand-link" href="./">
            <img class="brand-mark" src="img/mark.svg" alt="" width="40" height="40">
            <h1 id="app-title" class="brand-name" data-i18n="app.name"></h1>
          </a>
          <span class="badge" data-i18n="app.badge"></span>
        </div>
        <p class="intro" data-i18n="app.intro"></p>

        <div class="mode" id="mode">
          <span class="label" id="mode-label" data-i18n="mode.title"></span>
          <div class="mode-switch" role="group" aria-labelledby="mode-label">
            <button type="button" id="mode-shop"><b data-i18n="mode.shop"></b><small data-i18n="mode.shopHint"></small></button>
            <button type="button" id="mode-round"><b data-i18n="mode.round"></b><small data-i18n="mode.roundHint"></small></button>
          </div>
        </div>

        <section class="delivery" id="delivery-body" aria-labelledby="delivery-label" hidden>
          <h2 id="delivery-label" data-i18n="delivery.title"></h2>
          <div class="segmented" role="group" data-i18n-aria-label="delivery.coverLabel">
            <button type="button" id="cover-km" data-i18n="delivery.byDistance"></button>
            <button type="button" id="cover-n" data-i18n="delivery.byNeighbours"></button>
          </div>
          <div class="delivery-range">
            <label for="cover-slider" id="cover-label"></label>
            <output for="cover-slider" id="cover-value"></output>
          </div>
          <input type="range" class="single" id="cover-slider">
          <p class="help" id="cover-help"></p>
          <div class="reach" id="reach" aria-live="polite"></div>
        </section>

        <p class="filters-off" id="filters-off" data-i18n="delivery.filtersOff" hidden></p>
        <p class="mobile-filters" id="mobile-filters" hidden>
          <span data-i18n="mobile.filtersActive"></span>
          <button type="button" class="link-btn" id="mobile-reset" data-i18n="filters.reset"></button>
        </p>
        <section class="filters" aria-labelledby="filters-title">
          <div class="section-head">
            <h2 id="filters-title" data-i18n="filters.title"></h2>
            <button type="button" class="link-btn" id="reset" data-i18n="filters.reset"></button>
          </div>
          <p class="help" id="filters-help"></p>
          <div id="criteria"></div>
        </section>

        <section aria-labelledby="top-title">
          <h2 id="top-title" data-i18n="top.title"></h2>
          <ol class="top-list" id="top-list"></ol>
        </section>

        <p class="site-note" data-i18n="legal.short"></p>
        <ul class="site-links">
          <li><a href="ma-selection/" data-i18n="sel.link"></a></li>
          <li><a href="sources/" data-i18n="sources.link"></a></li>
          <li><a href="infos-legales/#donnees" data-i18n="updates.link"></a></li>
          <li><a href="infos-legales/" data-i18n="legal.link"></a></li>
        </ul>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="map" class="map" role="region" data-i18n-aria-label="map.label"></div>

      <div class="topbar" id="topbar">
        <a class="brand-chip" href="./" data-i18n-aria-label="app.home">
          <svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="23" rx="16.5" ry="10" fill="#FFFEFB"/><path d="M14.5 27 19.5 18.5M22 28.3 27 19.8M29.5 27 34.5 18.5" stroke="#B42318" stroke-width="2.8" stroke-linecap="round" fill="none"/><path d="M8 38h32" stroke="#FFFEFB" stroke-width="2.6"/></svg>
        </a>
        <nav class="pill breadcrumb" data-i18n-aria-label="map.breadcrumb">
          <button type="button" class="crumb" id="crumb-france" data-i18n="map.france"></button><span class="sep" aria-hidden="true">›</span><b id="dep-name"></b>
        </nav>
        <div class="pill counts" id="counts" aria-live="polite"></div>
        <div class="grow"></div>
        <button type="button" class="pill iconbtn tool-btn" id="search-open" aria-expanded="false" aria-controls="search" data-i18n-aria-label="search.label">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        </button>
        <button type="button" class="pill iconbtn tool-btn" id="locate" data-i18n-aria-label="locate.label">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        </button>
        <div class="search">
          <input type="search" id="search" class="pill" role="combobox" aria-autocomplete="list"
                 aria-expanded="false" aria-controls="search-results" autocomplete="off"
                 data-i18n-aria-label="search.label" data-i18n-placeholder="search.placeholder">
          <ul id="search-results" role="listbox" hidden data-i18n-aria-label="search.label"></ul>
          <span class="visually-hidden" id="search-status" aria-live="polite"></span>
        </div>
        <div class="pill zoom">
          <button type="button" class="iconbtn" id="zoom-in" data-i18n-aria-label="map.zoomIn">+</button>
          <button type="button" class="iconbtn" id="zoom-out" data-i18n-aria-label="map.zoomOut">−</button>
          <button type="button" class="iconbtn" id="zoom-reset" data-i18n-aria-label="map.resetView">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          </button>
        </div>
      </div>

      <div class="legend pill" id="legend" role="group" data-i18n-aria-label="legend.title">
        <button type="button" class="legend-toggle" id="legend-toggle" aria-expanded="true" data-i18n="legend.title"></button>
        <div id="legend-deps"></div>
        <div id="legend-delivery" hidden>
          <div><span class="swatch" style="background:#1E3F8A"></span><span data-i18n-html="legend.d_open"></span></div>
          <div><span class="swatch swatch-light" style="background:#D8CDB6"></span><span data-i18n="legend.d_has"></span></div>
          <div><span class="swatch" style="background:#1C1A17;transform:rotate(45deg) scale(0.8)"></span><span data-i18n="legend.d_base"></span></div>
          <div><span class="swatch swatch-light" style="background:#F7F5F0"></span><span data-i18n="legend.d_out"></span></div>
        </div>
        <div id="legend-communes" hidden>
          <div><span class="swatch" style="background:#1E3F8A"></span><span data-i18n-html="legend.go"></span></div>
          <div><span class="swatch swatch-light" style="background:#EAE6DC"></span><span data-i18n-html="legend.maybe"></span></div>
          <div><span class="swatch is-hatched" style="background:#D2B98E"></span><span data-i18n-html="legend.avoid"></span></div>
          <div><span class="swatch swatch-light" style="background:#F7F5F0"></span><span data-i18n="legend.out"></span></div>
        </div>
      </div>

      <div class="map-busy" id="map-busy" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span><span data-i18n="map.busy"></span>
      </div>
      <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
      <section class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="card-title" hidden></section>
      <section class="notice" id="notice" aria-labelledby="notice-title" hidden>
        <p class="notice-title" id="notice-title" data-i18n="notice.title"></p>
        <p data-i18n-html="notice.text"></p>
        <div class="notice-actions">
          <button type="button" class="btn" id="notice-ok" data-i18n="notice.ok"></button>
          <a href="infos-legales/#conditions" data-i18n="notice.more"></a>
        </div>
      </section>
      <div class="status" id="status" role="status"></div>
    </main>
  </div>
</body>
</html>
