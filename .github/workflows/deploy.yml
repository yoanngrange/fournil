name: Build data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 3 * *" # monthly, after the SIRENE stock is republished on the 1st
    - cron: "0 5 8 * *" # second chance: Insee sometimes publishes a stock file a few days late (Nov 2026)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Month (cache key for raw downloads)
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Raw downloads (~2.5 GB, mostly SIRENE) are reused within a month and for unchanged sources.
      - uses: actions/cache@v4
        with:
          path: pipeline/raw
          key: raw-${{ steps.month.outputs.value }}-${{ hashFiles('pipeline/config.py') }}

      - name: Build data
        run: uv run python -m pipeline.run --all

      - name: Test data
        run: uv run pytest -q

      - name: Assemble site
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }} # Cloudflare Web Analytics; empty = no analytics tag
        run: bash scripts/build_site.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # ~35,000 files: GitHub's file sync regularly takes more than the default 10 minutes.
          timeout: 1800000

  # Any failure (a source renamed or late, a data test failing, the deploy) emails Yoann.
  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Email the failure
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "RESEND_API_KEY not set, skipping"; exit 0; fi
          python3 scripts/notify.py "[fournyl.com] Data build failed (${{ github.event_name }})" \
            "The build-and-deploy workflow failed. The site keeps serving the previous data.

          Trigger: ${{ github.event_name }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If a source was not published yet, the run on the 8th retries; otherwise re-run it by hand once fixed."
