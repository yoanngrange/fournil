name: Daily site check

on:
  schedule:
    - cron: '17 6 * * *' # every day ~07:17/08:17 Paris
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pages and data freshness (emails only on problems)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://yoanngrange.github.io/fournil/' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then python3 scripts/monitor.py --dry-run; else python3 scripts/monitor.py; fi
