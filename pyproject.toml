[project]
name = "fournil-pipeline"
version = "0.1.0"
description = "Builds Fournil's static data files from French open data."
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.2.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
